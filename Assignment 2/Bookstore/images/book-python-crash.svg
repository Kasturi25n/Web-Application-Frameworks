<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPython" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <linearGradient id="blueSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#306998" />
      <stop offset="100%" stop-color="#2D5A7B" />
    </linearGradient>
    <linearGradient id="yellowSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD43B" />
      <stop offset="100%" stop-color="#FFE873" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgPython)" />

  <!-- Python logo-ish graphics / stylized curves -->
  <g transform="translate(200, 220) scale(1.3)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Blue Python half -->
    <path d="M -40,-20 L -20,-20 A 20,20 0 0,1 0,0 L 0,20 A 20,20 0 0,0 20,40 L 40,40 A 20,20 0 0,0 40,0 L 20,0 L 20,10 A 10,10 0 0,1 10,20 L -20,20 A 20,20 0 0,1 -40,0 Z" fill="url(#blueSnake)" />
    <!-- Yellow Python half -->
    <path d="M 40,20 L 20,20 A 20,20 0 0,1 0,0 L 0,-20 A 20,20 0 0,0 -20,-40 L -40,-40 A 20,20 0 0,0 -40,0 L -20,0 L -20,-10 A 10,10 0 0,1 -10,-20 L 20,-20 A 20,20 0 0,1 40,0 Z" fill="url(#yellowSnake)" />
    
    <!-- Eyes -->
    <circle cx="-25" cy="-25" r="3" fill="#1E1E24" />
    <circle cx="25" cy="25" r="3" fill="#1E1E24" />
  </g>
  
  <!-- Speed lines (representing Crash Course) -->
  <g stroke="#FFD43B" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <line x1="80" y1="120" x2="140" y2="120" />
    <line x1="60" y1="140" x2="110" y2="140" />
    <line x1="280" y1="300" x2="330" y2="300" stroke="#306998" />
    <line x1="260" y1="320" x2="340" y2="320" stroke="#306998" />
  </g>

  <!-- Typography -->
  <g font-family="'Poppins', sans-serif" text-anchor="middle">
    <!-- Subtitle on top -->
    <text x="200" y="70" font-size="11" font-weight="600" fill="#FFD43B" letter-spacing="2">A HANDS-ON, PROJECT-BASED INTRODUCTION TO PROGRAMMING</text>
    
    <!-- Title -->
    <text x="200" y="380" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="1">PYTHON</text>
    <text x="200" y="420" font-size="28" font-weight="700" fill="#FFE873" letter-spacing="1">CRASH COURSE</text>
    
    <!-- Edition badge -->
    <rect x="140" y="445" width="120" height="24" rx="12" fill="#306998" />
    <text x="200" y="461" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="1">3RD EDITION</text>

    <!-- Author -->
    <text x="200" y="525" font-size="16" font-weight="700" fill="#FFFFFF">ERIC MATTHES</text>
    <text x="200" y="545" font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="0.5">NO STARCH PRESS</text>
  </g>
</svg>
