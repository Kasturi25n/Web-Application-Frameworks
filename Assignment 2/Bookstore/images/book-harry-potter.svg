<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1521" />
      <stop offset="100%" stop-color="#1C0509" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F5E6D3" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Cover Background -->
  <rect width="100%" height="100%" fill="url(#bgHP)" />
  <rect width="100%" height="100%" fill="url(#glow)" />

  <!-- Cover Art: Minimal Glasses & Lightning Bolt -->
  <g stroke="#D3A625" stroke-width="3" fill="none" opacity="0.8">
    <!-- Glasses Left Rim -->
    <circle cx="150" cy="280" r="35" />
    <!-- Glasses Right Rim -->
    <circle cx="250" cy="280" r="35" />
    <!-- Bridge -->
    <path d="M 185 280 A 15 15 0 0 1 215 280" />
    <!-- Lightning Bolt -->
    <path d="M 200 160 L 180 220 L 210 220 L 195 270 L 225 210 L 195 210 Z" fill="#D3A625" stroke-width="1" />
  </g>

  <!-- Stars / Magic Sparkles -->
  <g fill="#D3A625" opacity="0.6">
    <circle cx="80" cy="180" r="2" />
    <circle cx="120" cy="150" r="3" />
    <circle cx="300" cy="190" r="2.5" />
    <circle cx="280" cy="340" r="2" />
    <circle cx="100" cy="360" r="3" />
    <circle cx="320" cy="250" r="1.5" />
  </g>

  <!-- Typography -->
  <g font-family="'Poppins', sans-serif" text-anchor="middle" fill="#FFFFFF">
    <!-- Author -->
    <text x="200" y="80" font-size="14" letter-spacing="4" font-weight="500" fill="#D3A625">J. K. ROWLING</text>
    
    <!-- Decorative Line -->
    <line x1="170" y1="95" x2="230" y2="95" stroke="#D3A625" stroke-width="2" opacity="0.8" />
    
    <!-- Title -->
    <text x="200" y="470" font-size="34" font-weight="800" letter-spacing="2" fill="#D3A625">HARRY POTTER</text>
    <text x="200" y="515" font-size="20" font-weight="600" letter-spacing="1">AND THE SORCERER'S STONE</text>
    
    <!-- Subtitle -->
    <text x="200" y="555" font-size="11" font-weight="500" fill="#D3A625" letter-spacing="1">Book 1 of the Legendary Saga</text>
  </g>
</svg>
