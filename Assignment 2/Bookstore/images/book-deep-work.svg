<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="focusGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#EA580C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgDeep)" />
  <circle cx="200" cy="240" r="180" fill="url(#focusGlow)" />

  <!-- Concentric focus rings -->
  <circle cx="200" cy="240" r="100" fill="none" stroke="#F97316" stroke-width="2" opacity="0.4" />
  <circle cx="200" cy="240" r="60" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.6" stroke-dasharray="6 4" />
  <circle cx="200" cy="240" r="20" fill="#F97316" />

  <!-- Typography -->
  <g font-family="'Poppins', sans-serif" text-anchor="middle">
    <!-- Author -->
    <text x="200" y="80" font-size="16" font-weight="600" fill="#F8FAFC" letter-spacing="3">CAL NEWPORT</text>
    <text x="200" y="100" font-size="10" font-weight="500" fill="#94A3B8" letter-spacing="1">Bestselling Author of So Good They Can't Ignore You</text>
    
    <!-- Title -->
    <text x="200" y="420" font-size="44" font-weight="800" fill="#F97316" letter-spacing="4">DEEP</text>
    <text x="200" y="470" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="4">WORK</text>
    
    <!-- Subtitle -->
    <text x="200" y="515" font-size="12" font-weight="600" fill="#E2E8F0">Rules for Focused Success in a Distracted World</text>
    
    <line x1="160" y1="540" x2="240" y2="540" stroke="#F97316" stroke-width="3" />
  </g>
</svg>
