<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background circular frame -->
  <circle cx="50" cy="50" r="50" fill="#E2583E" />
  
  <!-- Face/Skin -->
  <circle cx="50" cy="48" r="22" fill="#FFD3B6" />
  
  <!-- Hair (Back) -->
  <path d="M 28 48 C 28 25, 72 25, 72 48" fill="#5C3A21" />

  <!-- Eyes -->
  <circle cx="43" cy="45" r="2.5" fill="#222" />
  <circle cx="57" cy="45" r="2.5" fill="#222" />
  
  <!-- Smile -->
  <path d="M 44 54 Q 50 60 56 54" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" />
  
  <!-- Cheeks -->
  <circle cx="39" cy="50" r="2" fill="#FF8B94" opacity="0.6" />
  <circle cx="61" cy="50" r="2" fill="#FF8B94" opacity="0.6" />

  <!-- Neck -->
  <rect x="46" y="65" width="8" height="12" fill="#FFC3A0" />

  <!-- Clothes (Shoulders) -->
  <path d="M 22 90 C 22 75, 78 75, 78 90 Z" fill="#F5E6D3" />
  <path d="M 50 75 L 44 85 L 56 85 Z" fill="#FFD3B6" /> <!-- Neck cutout -->
