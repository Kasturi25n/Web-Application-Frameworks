<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31103f" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#spotlight)" />

  <!-- Abstract Grid & Tech Waves -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="800" y1="0" x2="800" y2="600" />
    <line x1="1000" y1="0" x2="1000" y2="600" />
  </g>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.15" filter="blur(40px)" />
  <circle cx="1000" cy="450" r="220" fill="#06b6d4" opacity="0.15" filter="blur(50px)" />
  <circle cx="600" cy="300" r="150" fill="#a855f7" opacity="0.2" filter="blur(30px)" />

  <!-- Floating Vector Elements: Circuit & Soundwave Graphics -->
  <path d="M 150 450 Q 350 250 600 400 T 1050 200" fill="none" stroke="url(#neonGlow)" stroke-width="4" opacity="0.7" />
  <path d="M 100 200 Q 400 450 750 200 T 1150 450" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4" stroke-dasharray="8 8" />

  <!-- Code brackets graphic right -->
  <g fill="none" stroke="#a855f7" stroke-width="6" opacity="0.5">
    <path d="M 950 180 L 900 240 L 950 300" />
    <path d="M 1050 180 L 1100 240 L 1050 300" />
  </g>

  <!-- Audio Equalizer Bars Left -->
  <g fill="url(#neonGlow)" opacity="0.6">
    <rect x="80" y="320" width="8" height="80" rx="4" />
    <rect x="96" y="280" width="8" height="120" rx="4" />
    <rect x="112" y="340" width="8" height="60" rx="4" />
    <rect x="128" y="260" width="8" height="140" rx="4" />
    <rect x="144" y="310" width="8" height="90" rx="4" />
  </g>
</svg>
