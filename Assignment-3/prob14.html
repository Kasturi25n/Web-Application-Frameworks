<!DOCTYPE html>
<html lang="en">
<head>
    <title>Problem 14: Student Grades</title>
</head>
<body>
    <h2>Problem 14 Output</h2>
    <div id="output"></div>
    <script>
        function calculateStudentStats(m1, m2, m3, m4, m5) {
            let total = m1 + m2 + m3 + m4 + m5;
            let average = total / 5;
            let percentage = (total / 500) * 100;
            let grade;
            
            if (percentage >= 90) grade = 'A';
            else if (percentage >= 80) grade = 'B';
            else if (percentage >= 70) grade = 'C';
            else if (percentage >= 60) grade = 'D';
            else grade = 'F';
            
            return `Total: ${total}<br>Average: ${average}<br>Percentage: ${percentage}%<br>Grade: ${grade}`;
        }
        
        document.getElementById("output").innerHTML = calculateStudentStats(85, 92, 78, 90, 88);
    </script>
</body>
</html>
