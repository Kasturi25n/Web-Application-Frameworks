<!DOCTYPE html>
<html lang="en">
<head>
    <title>Problem 30: Detailed Form Feedback</title>
</head>
<body>
    <h2>Detailed Validation Messages</h2>
    <input type="text" id="dEmail" placeholder="Email"><br><br>
    <input type="text" id="dMobile" placeholder="Mobile"><br><br>
    <input type="text" id="dPwd" placeholder="Password"><br><br>
    <button onclick="provideFeedback()">Check All</button>
    
    <div id="output" style="margin-top: 15px; line-height: 1.5;"></div>
    
    <script>
        function provideFeedback() {
            let email = document.getElementById("dEmail").value;
            let mobile = document.getElementById("dMobile").value;
            let pwd = document.getElementById("dPwd").value;
            
            let emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            let mobileValid = /^\d{10}$/.test(mobile);
            let pwdValid = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(pwd);
            
            let message = "";
            message += emailValid ? "<span style='color:green'>✔ Email is valid</span><br>" : "<span style='color:red'>✘ Invalid Email format</span><br>";
            message += mobileValid ? "<span style='color:green'>✔ Mobile is valid</span><br>" : "<span style='color:red'>✘ Mobile must be 10 digits</span><br>";
            message += pwdValid ? "<span style='color:green'>✔ Password is strong</span><br>" : "<span style='color:red'>✘ Password fails security checks</span><br>";
            
            document.getElementById("output").innerHTML = message;
        }
    </script>
</body>
</html>
