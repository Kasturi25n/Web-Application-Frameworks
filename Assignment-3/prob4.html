<!DOCTYPE html>
<html lang="en">
<head>
    <title>Problem 4: Temperature</title>
</head>
<body>
    <h2>Problem 4 Output</h2>
    <div id="output"></div>
    <script>
        function cToF(celsius) {
            return (celsius * 9/5) + 32;
        }
        function fToC(fahrenheit) {
            return (fahrenheit - 32) * 5/9;
        }
        
        document.getElementById("output").innerHTML = 
            `0°C is ${cToF(0)}°F <br> 212°F is ${fToC(212)}°C`;
    </script>
</body>
</html>
