<!DOCTYPE html>
<html lang="en">
<head>
    <title>Problem 15: Change Text</title>
</head>
<body>
    <h2 id="targetText">Original Text</h2>
    <button onclick="changeText()">Change Text</button>
    <script>
        function changeText() {
            document.getElementById("targetText").innerText = "Text Manipulated Successfully!";
        }
    </script>
</body>
</html>
