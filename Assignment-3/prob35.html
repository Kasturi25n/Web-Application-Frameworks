<!DOCTYPE html>
<html lang="en">
<head>
    <title>Problem 35: Keydown Event</title>
</head>
<body>
    <h2>Keystroke Interceptor</h2>
    <input type="text" id="keyInput" onkeydown="logKeystroke(event)" placeholder="Type something...">
    <div id="output" style="margin-top: 15px; color: darkred;"></div>
    
    <script>
        function logKeystroke(event) {
            document.getElementById("output").innerText = `Action Detected! You pressed the '${event.key}' key.`;
        }
    </script>
</body>
</html>
