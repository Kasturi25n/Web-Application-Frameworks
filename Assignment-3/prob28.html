<!DOCTYPE html>
<html lang="en">
<head>
    <title>Problem 28: Username Validation</title>
</head>
<body>
    <h2>Username Validator</h2>
    <input type="text" id="username" placeholder="Enter username (5-15 chars)">
    <button onclick="validateUsername()">Validate</button>
    <div id="output" style="margin-top: 15px; font-weight: bold;"></div>
    
    <script>
        function validateUsername() {
            let username = document.getElementById("username").value;
            let regex = /^[a-zA-Z0-9_]{5,15}$/;
            let resultDiv = document.getElementById("output");
            
            if (regex.test(username)) {
                resultDiv.innerText = "Valid Username";
                resultDiv.style.color = "green";
            } else {
                resultDiv.innerText = "Invalid: Must be 5-15 chars (alphanumeric/underscore only)";
                resultDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
