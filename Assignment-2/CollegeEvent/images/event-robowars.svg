      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#roboGrad)" />
  <!-- Gears Graphic -->
  <g fill="none" stroke="#f43f5e" stroke-width="4">
