<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background circular frame -->
  <circle cx="50" cy="50" r="50" fill="#306998" />
  
  <!-- Face/Skin -->
  <circle cx="50" cy="48" r="22" fill="#FFE5D9" />
  
  <!-- Hair -->
  <path d="M 28 40 Q 50 15 72 40 L 75 48 L 70 48 L 68 38 Q 50 30 32 38 L 30 48 L 25 48 Z" fill="#212529" />

  <!-- Eyes (behind glasses) -->
  <circle cx="42" cy="46" r="2" fill="#222" />
  <circle cx="58" cy="46" r="2" fill="#222" />
  
  <!-- Glasses -->
  <circle cx="42" cy="46" r="8" fill="none" stroke="#FFD43B" stroke-width="2" />
  <circle cx="58" cy="46" r="8" fill="none" stroke="#FFD43B" stroke-width="2" />
  <line x1="50" y1="46" x2="50" y2="46" stroke="#FFD43B" stroke-width="2" /> <!-- Bridge -->
  <line x1="34" y1="46" x2="30" y2="44" stroke="#FFD43B" stroke-width="2" /> <!-- Left arm -->
  <line x1="66" y1="46" x2="70" y2="44" stroke="#FFD43B" stroke-width="2" /> <!-- Right arm -->
  
  <!-- Smile -->
  <path d="M 45 56 Q 50 62 55 56" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="46" y="65" width="8" height="12" fill="#FCD5CE" />

  <!-- Clothes (Shoulders) -->
  <path d="M 22 90 C 22 75, 78 75, 78 90 Z" fill="#6F4E37" />
  <path d="M 50 75 L 45 85 L 55 85 Z" fill="#FFE5D9" /> <!-- Neck cutout -->
</svg>
