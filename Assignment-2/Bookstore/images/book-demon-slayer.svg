<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#24282F" />
    </linearGradient>
    <!-- Teal/Green Glow -->
    <linearGradient id="slashGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00B8FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Cover Background -->
  <rect width="100%" height="100%" fill="url(#bgDS)" />

  <!-- Tanjiro Checkered Pattern Accent (Left side/bottom) -->
  <g fill="#0D5C4D" opacity="0.15">
    <rect x="20" y="200" width="40" height="40" />
    <rect x="100" y="200" width="40" height="40" />
    <rect x="60" y="240" width="40" height="40" />
    <rect x="140" y="240" width="40" height="40" />
    <rect x="20" y="280" width="40" height="40" />
    <rect x="100" y="280" width="40" height="40" />
    <rect x="60" y="320" width="40" height="40" />
    <rect x="140" y="320" width="40" height="40" />
    
    <rect x="220" y="200" width="40" height="40" />
    <rect x="300" y="200" width="40" height="40" />
    <rect x="260" y="240" width="40" height="40" />
    <rect x="340" y="240" width="40" height="40" />
    <rect x="220" y="280" width="40" height="40" />
    <rect x="300" y="280" width="40" height="40" />
    <rect x="260" y="320" width="40" height="40" />
    <rect x="340" y="320" width="40" height="40" />
  </g>

  <!-- Katana Slash (Water/Fire Breathing effect) -->
  <path d="M 50 350 Q 200 220 350 250" stroke="url(#slashGlow)" stroke-width="12" fill="none" stroke-linecap="round" filter="drop-shadow(0px 0px 8px #00FFA3)" />
  <path d="M 50 350 Q 200 220 350 250" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Typography -->
  <g font-family="'Poppins', sans-serif" text-anchor="middle" fill="#FFFFFF">
    <!-- Author -->
    <text x="200" y="80" font-size="14" letter-spacing="4" font-weight="500" fill="#00FFA3">KOYOHARU GOTOUGE</text>
    
    <!-- Decorative Line -->
    <line x1="170" y1="95" x2="230" y2="95" stroke="#00FFA3" stroke-width="2" opacity="0.8" />
    
    <!-- Title -->
    <text x="200" y="470" font-size="34" font-weight="800" letter-spacing="3" fill="#FFFFFF">DEMON SLAYER</text>
    <text x="200" y="515" font-size="20" font-weight="600" letter-spacing="1" fill="#FF007A">KIMETSU NO YAIBA</text>
    
    <!-- Subtitle -->
    <text x="200" y="555" font-size="11" font-weight="500" fill="#00FFA3" letter-spacing="1">Vol. 1: Cruelty</text>
  </g>
</svg>
