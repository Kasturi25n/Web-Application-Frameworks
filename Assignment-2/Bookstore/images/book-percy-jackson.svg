<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8EE4FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Cover Background -->
  <rect width="100%" height="100%" fill="url(#bgPJ)" />
  <rect width="100%" height="100%" fill="url(#glow)" />

  <!-- Minimalist Golden Trident & Waves -->
  <g stroke="#FFD700" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Trident Middle Prong -->
    <line x1="200" y1="160" x2="200" y2="320" stroke-width="4.5" />
    <!-- Trident Left Prong -->
    <path d="M 160 190 L 160 230 A 40 40 0 0 0 200 270" />
    <!-- Trident Right Prong -->
    <path d="M 240 190 L 240 230 A 40 40 0 0 1 200 270" />
    <!-- Base decoration -->
    <circle cx="200" cy="300" r="6" fill="#FFD700" />
    
    <!-- Wave lines at bottom of art -->
    <path d="M 120 340 Q 160 330 200 340 T 280 340" stroke-width="2" opacity="0.5" />
    <path d="M 140 355 Q 170 348 200 355 T 260 355" stroke-width="2" opacity="0.3" />
  </g>

  <!-- Typography -->
  <g font-family="'Poppins', sans-serif" text-anchor="middle" fill="#FFFFFF">
    <!-- Author -->
    <text x="200" y="80" font-size="14" letter-spacing="4" font-weight="500" fill="#FFD700">RICK RIORDAN</text>
    
    <!-- Decorative Line -->
    <line x1="170" y1="95" x2="230" y2="95" stroke="#FFD700" stroke-width="2" opacity="0.8" />
    
    <!-- Title -->
    <text x="200" y="470" font-size="32" font-weight="800" letter-spacing="2" fill="#FFD700">PERCY JACKSON</text>
    <text x="200" y="515" font-size="20" font-weight="600" letter-spacing="1">THE LIGHTNING THIEF</text>
    
    <!-- Subtitle -->
    <text x="200" y="555" font-size="11" font-weight="500" fill="#FFD700" letter-spacing="1">Percy Jackson &amp; the Olympians</text>
  </g>
</svg>
